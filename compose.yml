services:
  # --- Semantic Router ---
  semantic-router:
    image: ghcr.io/vllm-project/semantic-router/extproc:latest
    ports:
      - "8080:8080"   # Classify API
      - "9190:9190"   # Metrics
    volumes:
      - ./config/semantic-router/config.yaml:/app/config/config.yaml:ro
    depends_on:
      - llm-research
      - llm-general

  envoy:
    image: envoyproxy/envoy:v1.35.3
    ports:
      - "8801:8801"   # OpenAI-compatible proxy
    volumes:
      - ./deploy/openshift/envoy.yaml:/etc/envoy/envoy.yaml:ro
    depends_on:
      - semantic-router

  # --- SR Dashboard ---
  sr-dashboard:
    image: ghcr.io/vllm-project/semantic-router/dashboard:latest
    ports:
      - "8700:8700"
    environment:
      DASHBOARD_PORT: "8700"
      TARGET_ROUTER_API_URL: http://semantic-router:8080
      TARGET_ROUTER_METRICS_URL: http://semantic-router:9190/metrics
      ROUTER_CONFIG_PATH: /app/config/config.yaml
    volumes:
      - ./config/semantic-router/config.yaml:/app/config/config.yaml:ro
    depends_on:
      - semantic-router

  # --- Model Serving (vLLM) ---
  llm-research:
    image: vllm/vllm-openai:latest
    ports:
      - "8001:8000"
    environment:
      HF_TOKEN: ${HF_TOKEN}
    command: >
      --model Qwen/Qwen3-8B
      --served-model-name research-agent
      --max-model-len 4096
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  llm-rag:
    image: vllm/vllm-openai:latest
    ports:
      - "8002:8000"
    environment:
      HF_TOKEN: ${HF_TOKEN}
    command: >
      --model ibm-granite/granite-3.1-8b-instruct
      --served-model-name rag-model
      --max-model-len 4096
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  llm-general:
    image: vllm/vllm-openai:latest
    ports:
      - "8003:8000"
    environment:
      HF_TOKEN: ${HF_TOKEN}
    command: >
      --model ibm-granite/granite-3.1-2b-instruct
      --served-model-name general-agent
      --max-model-len 4096
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # --- Llamastack (RAG agent) ---
  llamastack:
    image: quay.io/rh-ai-quickstart/llamastack:latest
    ports:
      - "8321:8321"
    depends_on:
      - pgvector
      - llm-rag

  # --- Storage ---
  pgvector:
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: semantic_router
    volumes:
      - pgvector-data:/var/lib/postgresql/data

  minio:
    image: quay.io/minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data

  # --- Application ---
  api:
    build:
      context: packages/api
      dockerfile: Containerfile
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      - semantic-router
      - llamastack
      - pgvector

  chat-ui:
    build:
      context: packages/chat-ui
      dockerfile: Containerfile
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgvector-data:
  minio-data:
