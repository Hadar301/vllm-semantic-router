apiVersion: v2
name: vllm-semantic-router
description: Intelligent semantic routing for multi-agent AI apps on OpenShift AI
type: application
version: 0.1.0
appVersion: "0.1.0"
keywords:
  - semantic-router
  - vllm
  - llm
  - routing
  - openshift-ai
home: https://github.com/rh-ai-quickstart/vllm-semantic-router
sources:
  - https://github.com/rh-ai-quickstart/vllm-semantic-router
dependencies:
  - name: llm-service
    alias: llm-service-research
    version: "0.5.9"
    repository: https://rh-ai-quickstart.github.io/ai-architecture-charts
    condition: llm-service-research.enabled
  - name: llm-service
    alias: llm-service-rag
    version: "0.5.9"
    repository: https://rh-ai-quickstart.github.io/ai-architecture-charts
    condition: llm-service-rag.enabled
  - name: llm-service
    alias: llm-service-general
    version: "0.5.9"
    repository: https://rh-ai-quickstart.github.io/ai-architecture-charts
    condition: llm-service-general.enabled
  - name: llama-stack
    version: "0.7.4"
    repository: https://rh-ai-quickstart.github.io/ai-architecture-charts
    condition: llama-stack.enabled
  - name: pgvector
    version: "0.5.5"
    repository: https://rh-ai-quickstart.github.io/ai-architecture-charts
    condition: pgvector.enabled
  - name: minio
    version: "0.5.5"
    repository: https://rh-ai-quickstart.github.io/ai-architecture-charts
    condition: minio.enabled
  - name: ingestion-pipeline
    version: "0.7.4"
    repository: https://rh-ai-quickstart.github.io/ai-architecture-charts
    condition: ingestion-pipeline.enabled
