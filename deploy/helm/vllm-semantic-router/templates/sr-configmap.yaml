apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "vllm-semantic-router.fullname" . }}-config
  labels:
    app.kubernetes.io/name: semantic-router
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  config.yaml: |
    version: v0.3
    listeners:
      - name: http-8899
        address: 0.0.0.0
        port: 8899
        timeout: 300s
    providers:
      defaults:
        default_model: general-agent
        reasoning_families:
          qwen3:
            type: chat_template_kwargs
            parameter: enable_thinking
      models:
        - name: research-agent
          reasoning_family: qwen3
          backend_refs:
            - name: research-vllm
              endpoint: {{ include "vllm-semantic-router.fullname" . }}-llm-research:8000
              protocol: http
              weight: 100
              type: chat
        - name: rag-agent
          backend_refs:
            - name: rag-llamastack
              endpoint: llamastack:8321
              protocol: http
              weight: 100
        - name: general-agent
          backend_refs:
            - name: general-vllm
              endpoint: {{ include "vllm-semantic-router.fullname" . }}-llm-general:8000
              protocol: http
              weight: 100
              type: chat
    routing:
      decisions:
        - name: blocked
          description: Block jailbreak and prompt injection attempts
          priority: 100
          rules:
            operator: OR
            conditions:
              - type: jailbreak
                name: detected
          modelRefs: []
        - name: pii-flagged
          description: Flag requests containing PII
          priority: 90
          rules:
            operator: OR
            conditions:
              - type: pii
                name: detected
          modelRefs:
            - model: general-agent
              use_reasoning: false
          plugins:
            - type: system_prompt
              configuration:
                enabled: true
                system_prompt: "The user's message may contain sensitive personal information. Do not repeat, store, or reference any PII."
                mode: prepend
        - name: research
          description: Route complex research and reasoning queries
          priority: 20
          rules:
            operator: OR
            conditions:
              - type: complexity
                name: high
              - type: domain
                name: research
          modelRefs:
            - model: research-agent
              use_reasoning: true
        - name: rag
          description: Route knowledge-base and document queries
          priority: 15
          rules:
            operator: OR
            conditions:
              - type: domain
                name: knowledge-base
              - type: keyword
                name: document-terms
          modelRefs:
            - model: rag-agent
              use_reasoning: false
        - name: general
          description: Default route for general conversation
          priority: 1
          rules:
            operator: OR
            conditions:
              - type: domain
                name: general
          modelRefs:
            - model: general-agent
              use_reasoning: false
      signals:
        domains:
          - name: research
          - name: knowledge-base
          - name: general
        keywords:
          - name: document-terms
      modelCards:
        - name: research-agent
        - name: rag-agent
        - name: general-agent
    global:
      router:
        auto_model_name: auto
      services:
        observability:
          metrics:
            enabled: true
            port: 9190
      stores:
        semantic_cache:
          enabled: true
          backend_type: memory
          similarity_threshold: 0.8
          max_entries: 1000
          ttl_seconds: 3600
          eviction_policy: fifo
          embedding_model: mmbert
